name: Build and Package DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with 'v': $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build App
        run: scripts/build-app.sh

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg --volname "ImageView Installer" \
                     --window-pos 200 120 \
                     --window-size 800 400 \
                     --icon-size 100 \
                     --icon "ImageView.app" 200 190 \
                     --hide-extension "ImageView.app" \
                     --app-drop-link 600 185 \
                     "ImageView.dmg" \
                     ".build/ImageView.app"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImageView.dmg
          path: ImageView.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ImageView ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ImageView.dmg
