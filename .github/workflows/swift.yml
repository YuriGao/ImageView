name: Test and Package ImageView

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run full test suite
        run: swift test --disable-sandbox
      - name: Check optimized interactive paths
        run: >-
          swift test --disable-sandbox --configuration release -Xswiftc -DTESTING
          --filter 'PerformanceGuardTests|ImageCacheTests|ImageDecodeExecutorTests|AnimationPlayerTests|ContinuousReadingLayoutTests|ViewerViewModelTests|FolderBrowserViewTests|FolderSessionTests'

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with 'v': $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build App
        run: scripts/build-app.sh

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg --volname "ImageView Installer" \
                     --window-pos 200 120 \
                     --window-size 800 400 \
                     --icon-size 100 \
                     --icon "ImageView.app" 200 190 \
                     --hide-extension "ImageView.app" \
                     --app-drop-link 600 185 \
                     "ImageView.dmg" \
                     ".build/ImageView.app"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImageView.dmg
          path: ImageView.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ImageView ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ImageView.dmg
